<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FG Tool (Standalone)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Import Maps for React, Firebase, and Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>
  
  <!-- Babel for running React directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc, updateDoc } from 'firebase/firestore';
    import { Book, Shield, Sword, FolderPlus, FilePlus, ChevronRight, ChevronUp, ChevronDown, X, Edit2, Plus, Save, Trash2, GripVertical, Folder, FileText, Pencil, Cloud, LogOut, Mail, Lock, UserPlus, LogIn } from 'lucide-react';

    // --- Firebase Configuration ---
    const isEnvProvided = typeof window.__firebase_config !== 'undefined';
    
    // ご自身のFirebaseプロジェクトの設定
    const standaloneConfig = {
      apiKey: "AIzaSyALJwiCDwAWmuYB8Bhd3VyxLP922A2Uo2k",
      authDomain: "fg-tool.firebaseapp.com",
      projectId: "fg-tool",
      storageBucket: "fg-tool.firebasestorage.app",
      messagingSenderId: "113539189260",
      appId: "1:113539189260:web:527e29852946c26581bc29",
      measurementId: "G-70YY0Q3L03"
    };

    const firebaseConfig = isEnvProvided ? JSON.parse(window.__firebase_config) : standaloneConfig;
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'fg-tool-standalone';

    let app, auth, db;
    let configError = null;

    try {
      if (!firebaseConfig.apiKey) {
         configError = "Firebaseの設定が必要です。";
      } else {
         app = initializeApp(firebaseConfig);
         auth = getAuth(app);
         db = getFirestore(app);
      }
    } catch (e) {
      configError = e.message;
    }

    // --- Constants & Defaults ---
    const CHARACTERS = [
      "A.K.I.", "アルジュン", "アレックス", "イングリッド", "エド", "エドモンド本田", "エレナ", "ガイル", "キャミィ", "キンバリー", "C.ヴァイパー", "ケン", "豪鬼", "サガット", "ザンギエフ", "ジェイミー", "JP", "ジュリ", "ダルシム", "春麗", "ディージェイ", "テリー", "ベガ", "ブランカ", "舞", "マノン", "マリーザ", "ヤスミン", "ラシード", "リュウ", "リリー", "ルーク"
    ];

    const CATEGORIES = ['①通常技', '②特殊技', '③必殺技', '④SA', '⑤通常投げ', '⑥共通行動'];
    const STRENGTHS = ['弱', '中', '強', 'OD', 'その他'];
    const COMBO_STATES = ['通常', 'カウンター', 'パニカン'];

    const DEFAULT_MOVES_DATA = {
      '①通常技': ['弱P', '中P', '強P', '弱K', '中K', '強K', '2弱P', '2中P', '2強P', '2弱K', '2中K', '2強K', 'j弱P', 'j中P', 'j強P', 'j弱K', 'j中K', 'j強K'],
      '④SA': ['SA1', 'SA2', 'SA3', 'CA'],
      '⑤通常投げ': ['前投げ', '後ろ投げ'],
      '⑥共通行動': ['前ステップ', 'バックステップ', 'インパクト', 'パリィ', 'ジャストパリィ', '生ラッシュ', 'Cラッシュ', '前歩き', '後ろ歩き', '前ジャンプ', '垂直', 'バックジャンプ', '何もしない']
    };

    const STRENGTH_COLORS = {
      '弱': 'bg-cyan-200 text-cyan-900 border-cyan-300',
      '中': 'bg-yellow-200 text-yellow-900 border-yellow-300',
      '強': 'bg-red-400 text-red-950 border-red-500',
      'OD': 'bg-orange-400 text-orange-950 border-orange-500',
      'その他': 'bg-white text-gray-900 border-gray-300'
    };

    const generateDefaultMoves = () => {
      let defaults = [];
      Object.entries(DEFAULT_MOVES_DATA).forEach(([category, names]) => {
        names.forEach(name => {
          let strength = 'その他';
          if (category === '①通常技') {
            if (name.includes('弱')) strength = '弱';
            else if (name.includes('中')) strength = '中';
            else if (name.includes('強')) strength = '強';
          }
          defaults.push({
            id: `def_${category}_${name}`,
            name, category, command: '', startup: '', block: '', hit: '', strength, isDefault: true
          });
        });
      });
      return defaults;
    };
    const ALL_DEFAULT_MOVES = generateDefaultMoves();

    // --- Components ---

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        if (!auth) return;
        
        if (isEnvProvided && typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
          signInWithCustomToken(auth, window.__initial_auth_token).catch(console.error);
        }

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (configError) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="bg-red-950/80 border border-red-800 p-6 rounded-lg max-w-md text-red-200">
              <h2 className="text-xl font-bold mb-4 flex items-center"><X className="mr-2"/> Setup Required</h2>
              <p className="text-sm leading-relaxed">{configError}</p>
            </div>
          </div>
        );
      }

      if (authLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-cyan-500 font-mono">Loading...</div>;

      if (!user) {
        return <LoginScreen auth={auth} />;
      }

      return <MainLayout db={db} user={user} appId={appId} auth={auth} />;
    }

    function LoginScreen({ auth }) {
      const [syncId, setSyncId] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSyncLogin = async (e) => {
        e.preventDefault();
        if (!syncId.trim()) { setError('同期IDを入力してください。'); return; }
        setLoading(true); setError('');
        
        const email = `${syncId.trim()}@fg-tool.local`;
        const password = `fgtool-${syncId.trim()}-secure`;
        
        try {
            await createUserWithEmailAndPassword(auth, email, password);
        } catch (err) {
            if (err.code === 'auth/email-already-in-use') {
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (loginErr) {
                    setError('ログインに失敗しました。別のIDをお試しください。');
                }
            } else {
                setError('エラーが発生しました: ' + err.message);
            }
        }
        setLoading(false);
      };

      const handleAnonymous = async () => {
        setLoading(true); setError('');
        try { await signInAnonymously(auth); }
        catch (err) { setError('エラーが発生しました: ' + err.message); setLoading(false); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4 font-sans text-slate-200">
          <div className="bg-slate-950 border border-slate-800 p-6 md:p-8 rounded-xl shadow-2xl max-w-md w-full">
            <h1 className="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-6 text-center">FG Tool</h1>
            <p className="text-sm text-slate-400 mb-6 text-center leading-relaxed">
              PCとスマホで同じデータを同期して利用するには、共通の「同期ID」を入力してください。
            </p>
            <form onSubmit={handleSyncLogin} className="space-y-4">
              <div>
                <input 
                  type="text" 
                  value={syncId} 
                  onChange={e => setSyncId(e.target.value)} 
                  placeholder="任意の同期ID (例: my-secret-123)"
                  className="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-white focus:outline-none focus:border-cyan-500 text-center"
                  disabled={loading}
                />
              </div>
              {error && <p className="text-red-400 text-xs text-center">{error}</p>}
              <button type="submit" disabled={loading} className="w-full py-3 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-lg shadow-cyan-900/20 disabled:opacity-50">
                {loading ? 'Connecting...' : '同期して開始 (Sync & Start)'}
              </button>
            </form>
            <div className="mt-6 border-t border-slate-800 pt-6">
              <button onClick={handleAnonymous} disabled={loading} className="w-full py-3 rounded-md text-sm font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition-colors disabled:opacity-50">
                同期せずに開始 (Start without Sync)
              </button>
              <p className="text-xs text-slate-500 text-center mt-3">※同期せずに開始した場合、データはこのブラウザにのみ保存されます。</p>
            </div>
          </div>
        </div>
      );
    }

    function MainLayout({ db, user, appId, auth }) {
      const [activeTab, setActiveTab] = useState('data');
      const [selectedChar, setSelectedChar] = useState(CHARACTERS[0]);
      
      const [allMoves, setAllMoves] = useState([]);
      const [allMemos, setAllMemos] = useState([]);
      const [allFolders, setAllFolders] = useState([]);
      const [allCards, setAllCards] = useState([]);

      useEffect(() => {
        if (!user) return;
        const unsub = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'memos'), (snap) => {
          setAllMemos(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [db, user, appId]);

      useEffect(() => {
        if (!user) return;
        const unsub = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'folders'), (snap) => {
          setAllFolders(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [db, user, appId]);

      useEffect(() => {
        if (!user) return;
        const unsub = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'cards'), (snap) => {
          setAllCards(snap.docs.map(d => ({ id: d.id, ...d.data() })));
        });
        return () => unsub();
      }, [db, user, appId]);

      const currentMoves = useMemo(() => {
        const customMovesForChar = allMoves.filter(m => m.charId === selectedChar);
        const merged = [];
        ALL_DEFAULT_MOVES.forEach(def => {
          const override = customMovesForChar.find(m => m.overrideId === def.id);
          if (override) merged.push({ ...override, isDefaultOverride: true });
          else merged.push(def);
        });
        const customOnly = customMovesForChar.filter(m => !m.overrideId);
        return [...merged, ...customOnly];
      }, [allMoves, selectedChar]);

      const currentMemos = useMemo(() => {
        return allMemos.filter(m => m.charId === selectedChar && m.tab === activeTab);
      }, [allMemos, selectedChar, activeTab]);

      return (
        <div className="h-screen flex flex-col bg-slate-900 text-slate-200 font-sans overflow-hidden">
          <header className="flex-none h-14 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
            <div className="flex items-center h-full">
              <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mr-6 md:mr-8">FG Tool</h1>
              <nav className="flex space-x-1 md:space-x-2 h-full items-end">
                <TabButton active={activeTab === 'data'} onClick={() => setActiveTab('data')} icon={<Book size={16} />} label="Data" />
                <TabButton active={activeTab === 'offense'} onClick={() => setActiveTab('offense')} icon={<Sword size={16} />} label="Offense" />
                <TabButton active={activeTab === 'defense'} onClick={() => setActiveTab('defense')} icon={<Shield size={16} />} label="Defense" />
              </nav>
            </div>
            <div className="flex items-center space-x-2">
              <div className="hidden md:flex items-center text-xs text-emerald-400 bg-emerald-950/30 px-2.5 py-1.5 rounded-md border border-emerald-900/50" title="Data status">
                <Cloud size={14} className="mr-1.5" />
                <span className="font-medium">{user.isAnonymous ? 'Local Only' : 'Cloud Synced'}</span>
              </div>
              <button onClick={() => auth.signOut()} className="flex items-center text-xs text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 px-2.5 py-1.5 rounded-md border border-slate-800 transition-colors" title="Change Sync ID">
                <LogOut size={14} className="mr-1.5 md:mr-0" />
                <span className="hidden md:inline ml-1.5">Logout</span>
              </button>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            <aside className="w-24 md:w-48 flex-none bg-slate-950 border-r border-slate-800 flex flex-col overflow-y-auto">
              <div className="p-3 border-b border-slate-800 sticky top-0 bg-slate-950/90 backdrop-blur z-10 hidden md:block">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Characters</span>
              </div>
              <div className="flex-1 p-2 space-y-1">
                {CHARACTERS.map(char => (
                  <button
                    key={char}
                    onClick={() => setSelectedChar(char)}
                    className={`w-full text-left px-2 md:px-3 py-2 rounded-md text-xs md:text-sm font-medium transition-colors ${
                      selectedChar === char 
                        ? 'bg-cyan-900 text-cyan-400 border border-cyan-700' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-transparent'
                    }`}
                  >
                    <span className="truncate block">{char}</span>
                  </button>
                ))}
              </div>
            </aside>
            <main className="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-900">
              {activeTab === 'data' ? (
                <DataView charName={selectedChar} moves={currentMoves} db={db} user={user} appId={appId} />
              ) : (
                <NotesView tab={activeTab} charName={selectedChar} memos={currentMemos} allFolders={allFolders} allCards={allCards} moves={currentMoves} db={db} user={user} appId={appId} />
              )}
            </main>
          </div>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center space-x-1.5 px-3 py-2 rounded-t-lg text-sm font-medium transition-all ${
            active 
              ? 'bg-slate-900 text-cyan-400 border-t border-l border-r border-slate-800 -mb-px' 
              : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'
          }`}
        >
          {icon}
          <span className="hidden sm:inline">{label}</span>
        </button>
      );
    }

    function Modal({ isOpen, onClose, title, children, maxWidth = 'max-w-md' }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
          <div className={`bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full ${maxWidth} max-h-[90vh] flex flex-col`}>
            <div className="flex justify-between items-center p-4 border-b border-slate-800 shrink-0">
              <h2 className="text-lg font-semibold text-slate-100">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors p-1"><X size={20} /></button>
            </div>
            <div className="p-4 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    }

    // --- Data Tab ---
    function DataView({ charName, moves, db, user, appId }) {
      const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
      const [editingMove, setEditingMove] = useState(null);

      const displayedMoves = useMemo(() => {
        return moves.filter(m => m.category === activeCategory);
      }, [moves, activeCategory]);

      const handleSaveMove = async (moveData) => {
        try {
          const isNewCustom = !moveData.id;
          const isDefaultEdit = moveData.isDefault; 
          
          let docRef;
          if (isDefaultEdit) {
            docRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'moves'));
            moveData.overrideId = moveData.id; 
            delete moveData.isDefault; 
            delete moveData.id; 
          } else if (isNewCustom) {
            docRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'moves'));
          } else {
            docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'moves', moveData.id);
          }

          await setDoc(docRef, {
            ...moveData,
            charId: charName,
            category: activeCategory,
            id: docRef.id
          });
          setEditingMove(null);
        } catch (err) {
          console.error("Error saving move:", err);
        }
      };

      const handleDeleteCustomMove = async (moveId) => {
        if (!moveId) return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'moves', moveId));
          setEditingMove(null);
        } catch (err) {
          console.error("Error deleting move:", err);
        }
      };

      return (
        <div className="flex flex-col h-full">
          {/* Category Tabs */}
          <div className="flex overflow-x-auto bg-slate-950 border-b border-slate-800 shrink-0 p-2 space-x-1">
            {CATEGORIES.map(cat => (
              <button
                key={cat}
                onClick={() => setActiveCategory(cat)}
                className={`px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition-colors ${
                  activeCategory === cat ? 'bg-cyan-900/50 text-cyan-300 border border-cyan-800/50' : 'text-slate-400 hover:bg-slate-800'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Main Content (Moves Grid) */}
          <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900/50">
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
              {displayedMoves.map((move) => (
                <MoveTile 
                  key={move.id || Math.random()} 
                  move={move} 
                  onClick={() => setEditingMove(move)} 
                />
              ))}
              
              {/* Add New Move Button */}
              <button
                onClick={() => setEditingMove({ category: activeCategory, name: '', command: '', startup: '', block: '', hit: '', strength: 'その他' })}
                className="flex flex-col items-center justify-center min-h-[100px] rounded-xl border-2 border-dashed border-slate-700 hover:border-cyan-500 hover:bg-slate-800/50 transition-all text-slate-500 hover:text-cyan-400 cursor-pointer"
              >
                <Plus size={24} className="mb-1" />
                <span className="text-sm font-medium">Add Move</span>
              </button>
            </div>
          </div>

          {/* Move Editor Modal */}
          <MoveEditorModal 
            move={editingMove} 
            isOpen={!!editingMove} 
            onClose={() => setEditingMove(null)} 
            onSave={handleSaveMove}
            onDelete={handleDeleteCustomMove}
          />
        </div>
      );
    }

    function MoveTile({ move, onClick, minimal = false }) {
