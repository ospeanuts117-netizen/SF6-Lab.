<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FG Tool (Standalone)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Import Maps for React, Firebase, and Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
  </script>
  
  <!-- Babel for running React directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useRef, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, addDoc, updateDoc } from 'firebase/firestore';
    import { Book, Shield, Sword, FolderPlus, FilePlus, ChevronRight, ChevronUp, ChevronDown, X, Edit2, Plus, Save, Trash2, GripVertical, Folder, FileText, Pencil, Cloud, LogOut, Mail, Lock, UserPlus, LogIn } from 'lucide-react';

    // --- Firebase Configuration ---
    // IMPORTANT: Firebase API keys are not secrets. Configure Firestore Security Rules
    // so users can read/write only under their own users/{uid} data path.
    const isEnvProvided = typeof window.__firebase_config !== 'undefined';
    
    // ご自身のFirebaseプロジェクトの設定
    const standaloneConfig = {
      apiKey: "AIzaSyALJwiCDwAWmuYB8Bhd3VyxLP922A2Uo2k",
      authDomain: "fg-tool.firebaseapp.com",
      projectId: "fg-tool",
      storageBucket: "fg-tool.firebasestorage.app",
      messagingSenderId: "113539189260",
      appId: "1:113539189260:web:527e29852946c26581bc29",
      measurementId: "G-70YY0Q3L03"
    };

    const firebaseConfig = isEnvProvided ? JSON.parse(window.__firebase_config) : standaloneConfig;
    const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'fg-tool-standalone';

    let app, auth, db;
    let configError = null;

    try {
      if (!firebaseConfig.apiKey) {
         configError = "Firebaseの設定が必要です。";
      } else {
         app = initializeApp(firebaseConfig);
         auth = getAuth(app);
         db = getFirestore(app);
      }
    } catch (e) {
      configError = e.message;
    }

    // --- Constants & Defaults ---
    const createId = () => (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') ? globalThis.crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;

    const CHARACTERS = [
      "A.K.I.", "アルジュン", "アレックス", "イングリッド", "エド", "エドモンド本田", "エレナ", "ガイル", "キャミィ", "キンバリー", "C.ヴァイパー", "ケン", "豪鬼", "サガット", "ザンギエフ", "ジェイミー", "JP", "ジュリ", "ダルシム", "春麗", "ディージェイ", "テリー", "ブランカ", "ベガ", "舞", "マノン", "マリーザ", "ヤスミン", "ラシード", "リュウ", "リリー", "ルーク"
    ];

    const CATEGORIES = ['通常技', '特殊技', '必殺技', 'SA', '通常投げ', '共通行動'];
    const STRENGTHS = ['弱', '中', '強', 'OD', 'その他'];
    const COMBO_STATES = ['ノーマル', 'カウンター', 'パニカン'];

    const DEFAULT_MOVES_DATA = {
      '通常技': ['弱P', '中P', '強P', '弱K', '中K', '強K', '2弱P', '2中P', '2強P', '2弱K', '2中K', '2強K', 'j弱P', 'j中P', 'j強P', 'j弱K', 'j中K', 'j強K'],
      'SA': ['SA1', 'SA2', 'SA3', 'CA'],
      '通常投げ': ['前投げ', '後ろ投げ'],
      '共通行動': ['前ステップ', 'バックステップ', 'インパクト', 'パリィ', 'ジャストパリィ', '生ラッシュ', 'Cラッシュ', '前歩き', '後ろ歩き', '前ジャンプ', '垂直', 'バックジャンプ', '何もしない']
    };

    const STRENGTH_COLORS = {
      '弱': 'bg-cyan-200 text-cyan-900 border-cyan-300',
      '中': 'bg-yellow-200 text-yellow-900 border-yellow-300',
      '強': 'bg-red-400 text-red-950 border-red-500',
      'OD': 'bg-orange-400 text-orange-950 border-orange-500',
      'その他': 'bg-white text-gray-900 border-gray-300'
    };

    const generateDefaultMoves = () => {
      let defaults = [];
      Object.entries(DEFAULT_MOVES_DATA).forEach(([category, names]) => {
        names.forEach(name => {
          let strength = 'その他';
          if (category === '通常技') {
            if (name.includes('弱')) strength = '弱';
            else if (name.includes('中')) strength = '中';
            else if (name.includes('強')) strength = '強';
          }
          defaults.push({
            id: `def_${category}_${name}`,
            name, category, command: '', startup: '', block: '', hit: '', strength, isDefault: true
          });
        });
      });
      return defaults;
    };
    const ALL_DEFAULT_MOVES = generateDefaultMoves();

    // --- Components ---

    function App() {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);

      useEffect(() => {
        if (!auth) return;
        
        if (isEnvProvided && typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
          signInWithCustomToken(auth, window.__initial_auth_token).catch(err => console.error('Custom token sign-in failed:', err));
        }

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      if (configError) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900">
            <div className="bg-red-950/80 border border-red-800 p-6 rounded-lg max-w-md text-red-200">
              <h2 className="text-xl font-bold mb-4 flex items-center"><X className="mr-2"/> Setup Required</h2>
              <p className="text-sm leading-relaxed">{configError}</p>
            </div>
          </div>
        );
      }

      if (authLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-900 text-cyan-500 font-mono">Loading...</div>;

      if (!user) {
        return <LoginScreen auth={auth} />;
      }

      return <MainLayout db={db} user={user} appId={appId} auth={auth} />;
    }

    function LoginScreen({ auth }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleAccount = async (e) => {
        e.preventDefault();
        const normalizedEmail = email.trim().toLowerCase();
        if (!normalizedEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(normalizedEmail)) {
          setError('有効なメールアドレスを入力してください。'); return;
        }
        if (password.length < 6) { setError('パスワードは6文字以上にしてください。'); return; }
        setLoading(true); setError('');
        try {
          try {
            await signInWithEmailAndPassword(auth, normalizedEmail, password);
          } catch (signInError) {
            if (signInError.code === 'auth/user-not-found' || signInError.code === 'auth/invalid-credential' || signInError.code === 'auth/invalid-login-credentials') {
              await createUserWithEmailAndPassword(auth, normalizedEmail, password);
            } else {
              throw signInError;
            }
          }
        } catch (err) {
          const messages = {
            'auth/email-already-in-use': 'このメールアドレスは既に使用されています。パスワードを確認してください。',
            'auth/weak-password': 'パスワードは6文字以上にしてください。',
            'auth/invalid-email': 'メールアドレスの形式が正しくありません。',
            'auth/network-request-failed': 'ネットワークに接続できませんでした。'
          };
          setError(messages[err.code] || `認証に失敗しました: ${err.message}`);
        } finally { setLoading(false); }
      };

      const handleAnonymous = async () => {
        setLoading(true); setError('');
        try { await signInAnonymously(auth); }
        catch (err) { setError(`ゲストログインに失敗しました: ${err.message}`); }
        finally { setLoading(false); }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4 font-sans text-slate-200">
          <div className="bg-slate-950 border border-slate-800 p-6 md:p-8 rounded-xl shadow-2xl max-w-md w-full">
            <h1 className="text-3xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-6 text-center">FG Tool</h1>
            <p className="text-sm text-slate-400 mb-6 text-center leading-relaxed">複数端末でデータを同期するには、同じメールアドレスとパスワードを使用してください。初回はアカウントが作成されます。</p>
            <form onSubmit={handleAccount} className="space-y-4">
              <input type="email" autoComplete="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="メールアドレス" className="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-white focus:outline-none focus:border-cyan-500" disabled={loading} required />
              <input type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="パスワード（6文字以上）" className="w-full bg-slate-900 border border-slate-700 rounded-md px-4 py-3 text-white focus:outline-none focus:border-cyan-500" disabled={loading} required minLength={6} />
              {error && <p role="alert" className="text-red-400 text-xs text-center">{error}</p>}
              <button type="submit" disabled={loading} className="w-full py-3 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-lg shadow-cyan-900/20 disabled:opacity-50">{loading ? 'Connecting...' : 'ログイン / 新規登録'}</button>
            </form>
            <div className="mt-6 border-t border-slate-800 pt-6">
              <button onClick={handleAnonymous} disabled={loading} className="w-full py-3 rounded-md text-sm font-medium text-slate-400 hover:text-white bg-slate-900 border border-slate-800 hover:border-slate-700 transition-colors disabled:opacity-50">ゲストとして開始</button>
              <p className="text-xs text-slate-500 text-center mt-3">※ゲスト利用もFirebaseにクラウド保存されます。別端末への引き継ぎにはメールアドレスでの登録を利用してください。</p>
            </div>
          </div>
        </div>
      );
    }

    function MainLayout({ db, user, appId, auth }) {
      const [activeTab, setActiveTab] = useState('data');
      const [notesTab, setNotesTab] = useState('offense');
      const [selectedChar, setSelectedChar] = useState(CHARACTERS[0]);
      
      const [allMoves, setAllMoves] = useState([]);
      const [allMemos, setAllMemos] = useState([]);
      const [allFolders, setAllFolders] = useState([]);
      const [allCards, setAllCards] = useState([]);
      const [cardSaveStates, setCardSaveStates] = useState({});
      const reportCardSave = useCallback((id, status) => {
        setCardSaveStates(previous => ({ ...previous, [id]: status }));
      }, []);
      const saveStatus = Object.values(cardSaveStates).includes('error') ? 'error'
        : Object.values(cardSaveStates).some(v => v === 'pending' || v === 'saving') ? 'saving' : 'synced';

      useEffect(() => {
        if (!user) return;
        const subscriptions = [
          ['moves', setAllMoves],
          ['memos', setAllMemos],
          ['folders', setAllFolders],
          ['cards', setAllCards]
        ].map(([name, setter]) => onSnapshot(
          collection(db, 'artifacts', appId, 'users', user.uid, name),
          snapshot => setter(snapshot.docs.map(item => ({ ...item.data(), id: item.id }))),
          error => console.error(`${name} listener error:`, error)
        ));
        return () => subscriptions.forEach(unsubscribe => unsubscribe());
      }, [db, user.uid, appId]);

      const currentMoves = useMemo(() => {
        const customMovesForChar = allMoves.filter(m => m.charId === selectedChar);
        const merged = [];
        ALL_DEFAULT_MOVES.forEach(def => {
          const override = customMovesForChar.find(m => m.overrideId === def.id);
          if (override) merged.push({ ...override, isDefaultOverride: true });
          else merged.push(def);
        });
        const customOnly = customMovesForChar.filter(m => !m.overrideId);
        return [...merged, ...customOnly];
      }, [allMoves, selectedChar]);

      return (
        <div className="h-screen flex flex-col bg-slate-900 text-slate-200 font-sans overflow-hidden">
          <header className="flex-none h-14 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-4 shrink-0">
            <div className="flex items-center h-full">
              <h1 className="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mr-6 md:mr-8">FG Tool</h1>
              <nav className="flex space-x-1 md:space-x-2 h-full items-end">
                <TabButton active={activeTab === 'data'} onClick={() => setActiveTab('data')} icon={<Book size={16} />} label="Data" />
                <TabButton active={activeTab === 'offense'} onClick={() => { if (activeTab !== 'offense') { setNotesTab('offense'); setActiveTab('offense'); } }} icon={<Sword size={16} />} label="Offense" />
                <TabButton active={activeTab === 'defense'} onClick={() => { if (activeTab !== 'defense') { setNotesTab('defense'); setActiveTab('defense'); } }} icon={<Shield size={16} />} label="Defense" />
              </nav>
            </div>
            <div className="flex items-center space-x-2">
              <div className={`hidden md:flex items-center text-xs px-2.5 py-1.5 rounded-md border ${saveStatus === 'error' ? 'text-red-400 bg-red-950/30 border-red-900/50' : saveStatus === 'saving' ? 'text-amber-400 bg-amber-950/30 border-amber-900/50' : 'text-emerald-400 bg-emerald-950/30 border-emerald-900/50'}`} title="Card save status">
                <Cloud size={14} className="mr-1.5" />
                <span className="font-medium">{saveStatus === 'error' ? 'Save Failed' : saveStatus === 'saving' ? 'Saving...' : 'Cloud Synced'}</span>
              </div>
              <button onClick={() => auth.signOut()} className="flex items-center text-xs text-slate-400 hover:text-white bg-slate-900 hover:bg-slate-800 px-2.5 py-1.5 rounded-md border border-slate-800 transition-colors" title="ログアウト">
                <LogOut size={14} className="mr-1.5 md:mr-0" />
                <span className="hidden md:inline ml-1.5">Logout</span>
              </button>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            <aside className="w-24 md:w-48 flex-none bg-slate-950 border-r border-slate-800 flex flex-col overflow-y-auto">
              <div className="p-3 border-b border-slate-800 sticky top-0 bg-slate-950/90 backdrop-blur z-10 hidden md:block">
                <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Characters</span>
              </div>
              <div className="flex-1 p-2 space-y-1">
                {CHARACTERS.map(char => (
                  <button
                    key={char}
                    onClick={() => { if (selectedChar !== char) setSelectedChar(char); }}
                    className={`w-full text-left px-2 md:px-3 py-2 rounded-md text-xs md:text-sm font-medium transition-colors ${
                      selectedChar === char 
                        ? 'bg-cyan-900 text-cyan-400 border border-cyan-700' 
                        : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-transparent'
                    }`}
                  >
                    <span className="truncate block">{char}</span>
                  </button>
                ))}
              </div>
            </aside>
            <main className="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-900">
              <div className={activeTab === 'data' ? 'hidden h-full' : 'flex flex-1 min-h-0'}>
                <NotesView tab={notesTab} charName={selectedChar}
                  memos={allMemos.filter(m => m.charId === selectedChar && m.tab === notesTab)}
                  allFolders={allFolders} allCards={allCards} moves={currentMoves} reportCardSave={reportCardSave} db={db} user={user} appId={appId} />
              </div>
              {activeTab === 'data' && <DataView charName={selectedChar} moves={currentMoves} db={db} user={user} appId={appId} />}
            </main>
          </div>
        </div>
      );
    }

    function TabButton({ active, onClick, icon, label }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center space-x-1.5 px-3 py-2 rounded-t-lg text-sm font-medium transition-all ${
            active 
              ? 'bg-slate-900 text-cyan-400 border-t border-l border-r border-slate-800 -mb-px' 
              : 'text-slate-500 hover:text-slate-300 hover:bg-slate-800/50'
          }`}
        >
          {icon}
          <span className="hidden sm:inline">{label}</span>
        </button>
      );
    }

    function Modal({ isOpen, onClose, title, children, maxWidth = 'max-w-md' }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
          <div className={`bg-slate-900 border border-slate-700 rounded-xl shadow-2xl w-full ${maxWidth} max-h-[90vh] flex flex-col`}>
            <div className="flex justify-between items-center p-4 border-b border-slate-800 shrink-0">
              <h2 className="text-lg font-semibold text-slate-100">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors p-1"><X size={20} /></button>
            </div>
            <div className="p-4 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    }

    // --- Data Tab ---
    function DataView({ charName, moves, db, user, appId }) {
      const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
      const [editingMove, setEditingMove] = useState(null);

      const displayedMoves = useMemo(() => {
        return moves.filter(m => m.category === activeCategory);
      }, [moves, activeCategory]);

      const handleSaveMove = async (moveData) => {
        try {
          const payload = { ...moveData };
          const isNewCustom = !payload.id;
          const isDefaultEdit = payload.isDefault === true;
          let docRef;
          if (isDefaultEdit) {
            docRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'moves'));
            payload.overrideId = payload.id;
            delete payload.isDefault;
            delete payload.id;
          } else if (isNewCustom) {
            docRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'moves'));
          } else {
            docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'moves', moveData.id);
          }

          await setDoc(docRef, {
            ...payload,
            charId: charName,
            category: payload.category || activeCategory,
            id: docRef.id
          });
          setEditingMove(null);
        } catch (err) {
          console.error("Error saving move:", err);
          alert(`技データを保存できませんでした: ${err.message}`);
        }
      };

      const handleDeleteCustomMove = async (moveId) => {
        if (!moveId) return;
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'moves', moveId));
          setEditingMove(null);
        } catch (err) {
          console.error("Error deleting move:", err);
          alert(`技データを削除できませんでした: ${err.message}`);
        }
      };

      return (
        <div className="flex flex-col h-full">
          {/* Category Tabs */}
          <div className="flex overflow-x-auto bg-slate-950 border-b border-slate-800 shrink-0 p-2 space-x-1">
            {CATEGORIES.map(cat => (
              <button
                key={cat}
                onClick={() => setActiveCategory(cat)}
                className={`px-4 py-1.5 rounded-full text-sm whitespace-nowrap transition-colors ${
                  activeCategory === cat ? 'bg-cyan-900/50 text-cyan-300 border border-cyan-800/50' : 'text-slate-400 hover:bg-slate-800'
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Main Content (Moves Grid) */}
          <div className="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-900/50">
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
              {displayedMoves.map((move) => (
                <MoveTile 
                  key={move.id} 
                  move={move} 
                  onClick={() => setEditingMove(move)} 
                />
              ))}
              
              {/* Add New Move Button */}
              <button
                onClick={() => setEditingMove({ category: activeCategory, name: '', command: '', startup: '', block: '', hit: '', strength: 'その他' })}
                className="flex flex-col items-center justify-center min-h-[100px] rounded-xl border-2 border-dashed border-slate-700 hover:border-cyan-500 hover:bg-slate-800/50 transition-all text-slate-500 hover:text-cyan-400 cursor-pointer"
              >
                <Plus size={24} className="mb-1" />
                <span className="text-sm font-medium">Add Move</span>
              </button>
            </div>
          </div>

          {/* Move Editor Modal */}
          <MoveEditorModal 
            move={editingMove} 
            isOpen={!!editingMove} 
            onClose={() => setEditingMove(null)} 
            onSave={handleSaveMove}
            onDelete={handleDeleteCustomMove}
          />
        </div>
      );
    }

    function MoveTile({ move, onClick, minimal = false }) {
      const colorClass = STRENGTH_COLORS[move.strength] || STRENGTH_COLORS['その他'];
      if (minimal) {
        return (
          <div className={`px-2 py-1 rounded text-xs font-bold border shadow-sm ${colorClass} inline-flex items-center justify-center min-w-[3rem]`}>
            {move.name}
          </div>
        );
      }
      return (
        <div onClick={onClick} className={`relative flex flex-col rounded-xl border-b-4 shadow-md cursor-pointer hover:brightness-110 active:scale-95 transition-all overflow-hidden ${colorClass} min-h-[100px]`}>
          <div className="px-2 py-1.5 bg-black/10 border-b border-black/10 font-bold text-sm flex justify-between items-center">
            <span className="truncate" title={move.name}>{move.name || 'Unnamed'}</span>
            {move.command && <span className="text-[10px] opacity-70 ml-1 font-mono bg-black/10 px-1 rounded whitespace-nowrap">{move.command}</span>}
          </div>
          <div className="flex-1 p-2 grid grid-cols-3 gap-x-2 text-xs items-center">
            <div className="flex flex-col min-w-0"><span className="opacity-60 text-[10px] leading-tight">発生</span><span className="font-semibold whitespace-nowrap">{move.startup || '-'}</span></div>
            <div className="flex flex-col min-w-0"><span className="opacity-60 text-[10px] leading-tight">ガード</span><span className="font-semibold whitespace-nowrap">{move.block || '-'}</span></div>
            <div className="flex flex-col min-w-0"><span className="opacity-60 text-[10px] leading-tight">ヒット</span><span className="font-semibold whitespace-nowrap">{move.hit || '-'}</span></div>
          </div>
        </div>
      );
    }

    function splitFrameValue(rawValue) {
      const raw = String(rawValue ?? '').trim();
      if (!raw) return { sign: '+', value: '' };
      const match = raw.match(/^([+-])(.*)$/);
      return match ? { sign: match[1], value: match[2] } : { sign: '+', value: raw };
    }

    function FrameInput({ label, name, value, onChange }) {
      const parsed = splitFrameValue(value);
      const setSign = (sign) => onChange(name, `${sign}${parsed.value}`);
      const setNumber = (nextValue) => onChange(name, nextValue === '' ? '' : `${parsed.sign}${nextValue}`);
      return (
        <div className="min-w-0">
          <label className="block text-xs font-medium text-slate-400 mb-1">{label}</label>
          <div className="flex items-center gap-1">
            <div className="flex shrink-0 rounded-md overflow-hidden border border-slate-700">
              {['+', '-'].map(sign => (
                <button type="button" key={sign} onClick={() => setSign(sign)}
                  className={`px-3 py-2 text-sm font-bold ${parsed.sign === sign ? 'bg-cyan-700 text-white' : 'bg-slate-950 text-slate-400 hover:text-white'}`}>{sign}</button>
              ))}
            </div>
            <input type="text" inputMode="text" value={parsed.value}
              onChange={e => setNumber(e.target.value)}
              className="min-w-0 w-full bg-slate-950 border border-slate-700 rounded-md px-2 py-2 text-white focus:outline-none focus:border-cyan-500"
              placeholder="数値" />
          </div>
        </div>
      );
    }

    function MoveEditorModal({ move, isOpen, onClose, onSave, onDelete }) {
      const [formData, setFormData] = useState({});
      useEffect(() => { if (move) setFormData({ ...move }); }, [move]);

      if (!isOpen || !move) return null;
      const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));
      const handleFrameChange = (name, value) => setFormData(prev => ({ ...prev, [name]: value }));
      const isCustomOrOverride = Boolean(formData.id && !formData.isDefault);

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="Edit Move">
          <div className="space-y-4">
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Name</label>
                <input type="text" name="name" value={formData.name || ''} onChange={handleChange}
                  className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="技名" />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Command</label>
                <input type="text" name="command" value={formData.command || ''} onChange={handleChange}
                  className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="コマンド" />
              </div>
            </div>

            <div>
              <label className="block text-xs font-medium text-slate-400 mb-2">Strength</label>
              <div className="grid grid-cols-5 gap-2">
                {STRENGTHS.map(strength => (
                  <button type="button" key={strength} onClick={() => setFormData(prev => ({ ...prev, strength }))}
                    className={`rounded-md border px-2 py-2 text-sm font-bold transition-colors ${STRENGTH_COLORS[strength]} ${formData.strength === strength ? 'ring-2 ring-cyan-400 ring-offset-2 ring-offset-slate-900' : 'opacity-60 hover:opacity-100'}`}>
                    {strength}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-3 gap-2">
              <FrameInput label="発生" name="startup" value={formData.startup || ''} onChange={handleFrameChange} />
              <FrameInput label="ヒット" name="hit" value={formData.hit || ''} onChange={handleFrameChange} />
              <FrameInput label="ガード" name="block" value={formData.block || ''} onChange={handleFrameChange} />
            </div>

            <div className="pt-4 flex justify-between items-center border-t border-slate-800 mt-6">
              {isCustomOrOverride ? (
                <button onClick={() => onDelete(formData.id)} className="text-red-400 hover:text-red-300 flex items-center text-sm px-2 py-1 rounded hover:bg-red-950/30 transition-colors"><Trash2 size={16} className="mr-1" /> Delete</button>
              ) : <div />}
              <div className="flex space-x-2">
                <button onClick={onClose} className="px-4 py-2 rounded-md text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">Cancel</button>
                <button onClick={() => formData.name?.trim() && onSave({ ...formData, name: formData.name.trim() })} disabled={!formData.name?.trim()}
                  className="flex items-center px-4 py-2 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-lg shadow-cyan-900/20 disabled:opacity-50"><Save size={16} className="mr-2" /> Save</button>
              </div>
            </div>
          </div>
        </Modal>
      );
    }

    // --- Notes Tab ---
    function NotesView({ tab, charName, memos, allFolders, allCards, moves, reportCardSave, db, user, appId }) {
      const [selectedMemoId, setSelectedMemoId] = useState(null);
      const [creatingType, setCreatingType] = useState(null);
      const [newItemTitle, setNewItemTitle] = useState('');
      const [editingId, setEditingId] = useState(null);
      const [editValue, setEditValue] = useState('');
      const [dragItem, setDragItem] = useState(null);
      const [dragOverTarget, setDragOverTarget] = useState(null);
      const pendingMemoSelectionRef = useRef(null);

      const currentFolders = useMemo(() => allFolders.filter(f => f.charId === charName && f.tab === tab).sort((a,b) => (a.order || 0) - (b.order || 0)), [allFolders, charName, tab]);
      const currentMemos = useMemo(() => [...memos].sort((a,b) => (a.order || 0) - (b.order || 0)), [memos]);

      useEffect(() => {
        const pendingId = pendingMemoSelectionRef.current;
        if (pendingId) {
          if (currentMemos.some(memo => memo.id === pendingId)) {
            setSelectedMemoId(pendingId);
            pendingMemoSelectionRef.current = null;
          }
          return;
        }
        const selectionStillExists = currentMemos.some(memo => memo.id === selectedMemoId);
        if (!selectionStillExists) setSelectedMemoId(currentMemos[0]?.id || null);
      }, [currentMemos, selectedMemoId]); 

      const openCreateModal = (type) => {
        setNewItemTitle('');
        setCreatingType(type);
      };

      const handleCreate = async () => {
        if (!newItemTitle.trim()) return;
        try {
          if (creatingType === 'folder') {
             await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'folders'), { charId: charName, tab, title: newItemTitle.trim(), order: currentFolders.length });
          } else if (creatingType && creatingType.type === 'memo') {
             const folderId = creatingType.folderId;
             const order = currentMemos.filter(m => m.folderId === folderId).length;
             const docRef = await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'memos'), { charId: charName, tab, title: newItemTitle.trim(), folderId, order });
             pendingMemoSelectionRef.current = docRef.id;
          }
          setCreatingType(null); setNewItemTitle('');
        } catch (err) { console.error(err); }
      };

      const handleRename = async (collectionName, id) => {
        if (editingId !== id) return;
        const title = editValue.trim();
        setEditingId(null); // Enter and blur can otherwise save the same rename twice.
        const items = collectionName === 'folders' ? currentFolders : currentMemos;
        if (!title || title === items.find(item => item.id === id)?.title) return;
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, collectionName, id), { title });
        } catch (error) {
          console.error('Rename failed:', error);
          alert(`名前の変更に失敗しました: ${error.message}`);
        }
      };

      const handleDeleteMemo = async (memo) => {
        if (!window.confirm(`「${memo.title}」と、その中のカードを削除しますか？この操作は取り消せません。`)) return;
        try {
          const relatedCards = allCards.filter(card => card.memoId === memo.id);
          await Promise.all(relatedCards.map(card => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id))));
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'memos', memo.id));
          if (selectedMemoId === memo.id) setSelectedMemoId(null);
        } catch (err) { console.error('Memo deletion failed:', err); alert(`メモを削除できませんでした: ${err.message}`); }
      };

      const handleDeleteFolder = async (folder) => {
        const childMemos = currentMemos.filter(memo => memo.folderId === folder.id);
        if (!window.confirm(`フォルダ「${folder.title}」と、配下のメモ${childMemos.length}件・カードをすべて削除しますか？この操作は取り消せません。`)) return;
        try {
          const memoIds = new Set(childMemos.map(memo => memo.id));
          const relatedCards = allCards.filter(card => memoIds.has(card.memoId));
          await Promise.all([
            ...relatedCards.map(card => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id))),
            ...childMemos.map(memo => deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'memos', memo.id)))
          ]);
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'folders', folder.id));
          if (memoIds.has(selectedMemoId)) setSelectedMemoId(null);
        } catch (err) { console.error('Folder deletion failed:', err); alert(`フォルダを削除できませんでした: ${err.message}`); }
      };

      const moveCard = async (card, direction) => {
        const index = currentCards.findIndex(item => item.id === card.id);
        const nextIndex = index + direction;
        if (index < 0 || nextIndex < 0 || nextIndex >= currentCards.length) return;
        const reordered = [...currentCards];
        [reordered[index], reordered[nextIndex]] = [reordered[nextIndex], reordered[index]];
        try {
          await Promise.all(reordered.map((item, order) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cards', item.id), { order })));
        } catch (err) { console.error('Card reorder failed:', err); alert(`カードの並べ替えに失敗しました: ${err.message}`); }
      };

      const handleDragStart = (e, type, item) => { e.dataTransfer.effectAllowed = 'move'; setDragItem({ type, ...item }); setTimeout(() => { if (e.target) e.target.style.opacity = '0.5'; }, 0); };
      const handleDragEnd = (e) => { if (e.target) e.target.style.opacity = '1'; setDragItem(null); setDragOverTarget(null); };

      const handleDrop = async (e, targetType, targetId, targetFolderId = null) => {
          e.preventDefault(); e.stopPropagation(); setDragOverTarget(null);
          if (!dragItem) return;
          const { type: draggedType, id: draggedId, folderId: sourceFolderId } = dragItem;
          if (draggedId === targetId && draggedType === targetType) return;
          try {
            if (draggedType === 'folder' && targetType === 'folder') {
              const reordered = [...currentFolders];
              const from = reordered.findIndex(folder => folder.id === draggedId);
              let to = reordered.findIndex(folder => folder.id === targetId);
              if (from < 0 || to < 0) return;
              const [item] = reordered.splice(from, 1);
              if (to > from) to--;
              reordered.splice(to, 0, item);
              await Promise.all(reordered.map((folder, order) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'folders', folder.id), { order })));
            } else if (draggedType === 'memo') {
              const draggedMemo = currentMemos.find(memo => memo.id === draggedId);
              if (!draggedMemo) return;
              const destinationFolderId = targetType === 'folder' ? targetId : (targetType === 'root' ? null : targetFolderId);
              const destination = currentMemos.filter(memo => memo.folderId === destinationFolderId && memo.id !== draggedId);
              let insertionIndex = targetType === 'memo' ? destination.findIndex(memo => memo.id === targetId) : destination.length;
              if (insertionIndex < 0) insertionIndex = destination.length;
              destination.splice(insertionIndex, 0, draggedMemo);
              const writes = destination.map((memo, order) => updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'memos', memo.id), { folderId: destinationFolderId, order }));
              if (sourceFolderId !== destinationFolderId && !destination.some(memo => memo.id === draggedId)) {
                writes.push(updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'memos', draggedId), { folderId: destinationFolderId, order: destination.length }));
              }
              await Promise.all(writes);
            }
          } catch (err) {
            console.error('Drag-and-drop update failed:', err);
            alert(`並べ替えに失敗しました: ${err.message}`);
          }
      };

      const currentCards = useMemo(() => allCards.filter(c => c.memoId === selectedMemoId).sort((a, b) => (a.order || 0) - (b.order || 0)), [allCards, selectedMemoId]);

      const handleAddCard = async () => {
        if (!selectedMemoId) return;
        try {
          await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'cards'), { memoId: selectedMemoId, blocks: [{ id: createId(), type: 'text', content: '' }], order: currentCards.length });
        } catch (err) { console.error(err); }
      };

      return (
        <div className="flex flex-1 overflow-hidden">
          <aside className="w-56 md:w-64 flex-none bg-slate-950/50 border-r border-slate-800 flex flex-col relative select-none">
            <div className="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950 shrink-0">
              <span className="text-sm font-semibold text-slate-300 hidden md:inline">Folders & Memos</span>
              <span className="text-sm font-semibold text-slate-300 md:hidden">Memos</span>
              <div className="flex space-x-1">
                  <button onClick={() => openCreateModal('folder')} className="p-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded transition-colors" title="New Folder"><FolderPlus size={16} /></button>
                  <button onClick={() => openCreateModal({type: 'memo', folderId: null})} className="p-1.5 text-slate-400 hover:text-cyan-400 hover:bg-slate-800 rounded transition-colors" title="New Root Memo"><FilePlus size={16} /></button>
              </div>
            </div>
            <div className={`flex-1 overflow-y-auto p-2 space-y-2 pb-20 ${dragOverTarget === 'root' ? 'bg-slate-800/20' : ''}`} onDragOver={(e) => { e.preventDefault(); setDragOverTarget('root'); }} onDrop={(e) => handleDrop(e, 'root', null, null)}>
              {currentFolders.map(folder => (
                <div key={folder.id} className="mb-2" onDragOver={(e) => { e.preventDefault(); setDragOverTarget(folder.id); e.stopPropagation(); }} onDrop={(e) => handleDrop(e, 'folder', folder.id, folder.id)}>
                  <div draggable onDragStart={(e) => handleDragStart(e, 'folder', folder)} onDragEnd={handleDragEnd} className={`flex items-center justify-between text-xs font-bold text-slate-400 uppercase tracking-wider px-2 py-1.5 rounded cursor-grab active:cursor-grabbing hover:bg-slate-800/50 group/folder ${dragOverTarget === folder.id ? 'bg-cyan-900/30 border border-cyan-700 text-cyan-300' : 'border border-transparent'}`}>
                     <div className="flex items-center flex-1 overflow-hidden">
                        <Folder size={14} className="mr-2 shrink-0" /> 
                        {editingId === folder.id ? <input autoFocus value={editValue} onChange={e=>setEditValue(e.target.value)} onBlur={()=>handleRename('folders', folder.id)} onKeyDown={e=>e.key==='Enter'&&handleRename('folders', folder.id)} className="bg-slate-900 border border-cyan-500 rounded px-1 py-0.5 w-full text-white font-normal" /> : <span className="truncate flex-1" onDoubleClick={(e) => { e.stopPropagation(); setEditingId(folder.id); setEditValue(folder.title); }}>{folder.title}</span>}
                     </div>
                     <div className="flex space-x-1 opacity-0 group-hover/folder:opacity-100 transition-opacity ml-2 shrink-0">
                        <button onClick={(e) => { e.stopPropagation(); setEditingId(folder.id); setEditValue(folder.title); }} className="hover:text-cyan-400 p-0.5"><Pencil size={12}/></button>
                        <button onClick={(e) => { e.stopPropagation(); openCreateModal({type:'memo', folderId: folder.id}); }} className="hover:text-cyan-400 p-0.5" title="メモを追加"><Plus size={12}/></button>
                        <button onClick={(e) => { e.stopPropagation(); handleDeleteFolder(folder); }} className="hover:text-red-400 p-0.5" title="フォルダを削除"><Trash2 size={12}/></button>
                     </div>
                  </div>
                  <div className="pl-3 mt-1 space-y-0.5 min-h-[4px]">
                      {currentMemos.filter(m => m.folderId === folder.id).map(memo => (
                         <MemoSidebarItem key={memo.id} memo={memo} selected={selectedMemoId === memo.id} onSelect={() => setSelectedMemoId(memo.id)} editingId={editingId} setEditingId={setEditingId} editValue={editValue} setEditValue={setEditValue} handleRename={handleRename} handleDragStart={handleDragStart} handleDragEnd={handleDragEnd} handleDrop={handleDrop} dragOverTarget={dragOverTarget} setDragOverTarget={setDragOverTarget} onDelete={handleDeleteMemo} />
                      ))}
                  </div>
                </div>
              ))}
              {currentMemos.filter(m => !m.folderId).map(memo => (
                 <MemoSidebarItem key={memo.id} memo={memo} selected={selectedMemoId === memo.id} onSelect={() => setSelectedMemoId(memo.id)} editingId={editingId} setEditingId={setEditingId} editValue={editValue} setEditValue={setEditValue} handleRename={handleRename} handleDragStart={handleDragStart} handleDragEnd={handleDragEnd} handleDrop={handleDrop} dragOverTarget={dragOverTarget} setDragOverTarget={setDragOverTarget} onDelete={handleDeleteMemo} />
              ))}
              {currentFolders.length === 0 && currentMemos.length === 0 && <div className="text-center p-4 text-xs text-slate-500 italic mt-10">No items yet.</div>}
            </div>
          </aside>
          <main className="flex-1 flex flex-col bg-slate-900 overflow-hidden relative">
            {selectedMemoId ? (
              <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                {currentCards.map((card, index) => <CardEditor key={card.id} card={card} moves={moves} reportCardSave={reportCardSave} db={db} appId={appId} user={user} onMove={direction => moveCard(card, direction)} isFirst={index === 0} isLast={index === currentCards.length - 1} />)}
                <button onClick={handleAddCard} className="w-full py-4 border-2 border-dashed border-slate-700 rounded-xl text-slate-500 hover:text-cyan-400 hover:border-cyan-500 hover:bg-slate-800/30 transition-all flex items-center justify-center font-medium"><Plus size={20} className="mr-2" /> Add New Card</button>
              </div>
            ) : <div className="flex-1 flex items-center justify-center text-slate-500 text-sm">Select or create a memo</div>}
          </main>
          <Modal isOpen={!!creatingType} onClose={() => setCreatingType(null)} title={creatingType === 'folder' ? "Create Folder" : "Create Memo"}>
            <div className="space-y-4">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Title</label>
                <input type="text" value={newItemTitle} onChange={e => setNewItemTitle(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleCreate()} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-white focus:outline-none focus:border-cyan-500" placeholder="Enter title..." autoFocus />
              </div>
              <div className="pt-4 flex justify-end space-x-2">
                <button onClick={() => setCreatingType(null)} className="px-4 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">Cancel</button>
                <button onClick={handleCreate} disabled={!newItemTitle.trim()} className="px-4 py-2 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white disabled:opacity-50 transition-colors">Create</button>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    function MemoSidebarItem({ memo, selected, onSelect, editingId, setEditingId, editValue, setEditValue, handleRename, handleDragStart, handleDragEnd, handleDrop, dragOverTarget, setDragOverTarget, onDelete }) {
       return (
           <div draggable onDragStart={(e) => handleDragStart(e, 'memo', memo)} onDragEnd={handleDragEnd} onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOverTarget(memo.id); }} onDrop={(e) => handleDrop(e, 'memo', memo.id, memo.folderId)} className={`w-full flex items-center justify-between text-left px-2 py-1.5 rounded-md text-sm transition-all cursor-grab active:cursor-grabbing group/memo border-l-2 ${selected ? 'bg-slate-800 text-white border-cyan-500 shadow-sm' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 border-transparent'} ${dragOverTarget === memo.id ? 'border-t-2 border-t-cyan-400 bg-slate-800/80' : ''}`}>
               <div className="flex items-center flex-1 overflow-hidden" onClick={onSelect}>
                   <FileText size={14} className="mr-2 opacity-50 shrink-0" />
                   {editingId === memo.id ? <input autoFocus value={editValue} onChange={e=>setEditValue(e.target.value)} onBlur={()=>handleRename('memos', memo.id)} onKeyDown={e=>e.key==='Enter'&&handleRename('memos', memo.id)} className="bg-slate-900 border border-cyan-500 rounded px-1 py-0.5 w-full text-white font-normal" /> : <span className="truncate flex-1" onDoubleClick={(e) => { e.stopPropagation(); setEditingId(memo.id); setEditValue(memo.title); }}>{memo.title}</span>}
               </div>
               <div className="flex items-center ml-2 shrink-0">
                 <button onClick={(e) => { e.stopPropagation(); setEditingId(memo.id); setEditValue(memo.title); }} className="opacity-0 group-hover/memo:opacity-100 hover:text-cyan-400 p-0.5" title="名前を変更"><Pencil size={12}/></button>
                 <button onClick={(e) => { e.stopPropagation(); onDelete(memo); }} className="opacity-0 group-hover/memo:opacity-100 hover:text-red-400 p-0.5" title="メモを削除"><Trash2 size={12}/></button>
               </div>
           </div>
       )
    }

    function AutoExpandingTextarea({ value, onChange, placeholder, className }) {
      const ref = useRef(null);
      useEffect(() => { if (ref.current) { ref.current.style.height = '0px'; ref.current.style.height = Math.max(60, ref.current.scrollHeight) + 'px'; } }, [value]);
      return <textarea ref={ref} value={value} onChange={onChange} placeholder={placeholder} className={`${className} overflow-hidden resize-none`} rows={1} />;
    }

    function CardEditor({ card, moves, db, appId, user, reportCardSave, onMove, isFirst, isLast }) {
      const [editingBlock, setEditingBlock] = useState(null);
      const initialBlocks = Array.isArray(card.blocks) ? card.blocks : [];
      const [blocks, setBlocks] = useState(initialBlocks);
      const blocksRef = useRef(initialBlocks);
      const saveTimerRef = useRef(null);
      const pendingRef = useRef(false);
      const inFlightRef = useRef(null);
      const savedJsonRef = useRef(JSON.stringify(initialBlocks));
      const latestJsonRef = useRef(JSON.stringify(initialBlocks));
      const deletedRef = useRef(false);
      const mountedRef = useRef(true);
      const saveContextRef = useRef({ db, appId, user, cardId: card.id, reportCardSave });
      saveContextRef.current = { db, appId, user, cardId: card.id, reportCardSave };

      // Only one Firestore write per card at a time. Changes made while a write
      // is running are combined into one subsequent write (latest value wins).
      const flushSave = () => {
        if (saveTimerRef.current) {
          clearTimeout(saveTimerRef.current);
          saveTimerRef.current = null;
        }
        if (deletedRef.current) return Promise.resolve();
        if (inFlightRef.current) return inFlightRef.current;
        if (latestJsonRef.current === savedJsonRef.current) {
          pendingRef.current = false;
          reportCardSave(card.id, 'synced');
          return Promise.resolve();
        }
        const { db: currentDb, appId: currentAppId, user: currentUser, cardId, reportCardSave: report } = saveContextRef.current;
        const json = latestJsonRef.current;
        const payload = JSON.parse(json);
        report(cardId, 'saving');
        const reference = doc(currentDb, 'artifacts', currentAppId, 'users', currentUser.uid, 'cards', cardId);
        const task = updateDoc(reference, { blocks: payload })
          .then(() => {
            savedJsonRef.current = json;
            if (latestJsonRef.current === json) {
              pendingRef.current = false;
              report(cardId, 'synced');
            }
          })
          .catch(error => {
            console.error('Card save failed:', error);
            report(cardId, 'error');
            throw error;
          })
          .finally(() => {
            inFlightRef.current = null;
            if (!deletedRef.current && latestJsonRef.current !== savedJsonRef.current &&
                savedJsonRef.current === json) {
              // An edit arrived during the request: save only its newest version.
              void flushSave().catch(() => {});
            }
          });
        inFlightRef.current = task;
        return task;
      };

      const commitBlocks = (updater, immediate = false) => {
        const previous = blocksRef.current;
        const next = typeof updater === 'function' ? updater(previous) : updater;
        const json = JSON.stringify(next);
        if (json === latestJsonRef.current) return;
        blocksRef.current = next;
        latestJsonRef.current = json;
        pendingRef.current = true;
        setBlocks(next);
        reportCardSave(card.id, 'pending');
        if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
        if (immediate) void flushSave().catch(() => {});
        else saveTimerRef.current = setTimeout(() => { void flushSave().catch(() => {}); }, 250);
      };

      const updateBlock = (blockId, patch, immediate = false) => {
        commitBlocks(previous => previous.map(block => block.id === blockId ? { ...block, ...patch } : block), immediate);
      };

      const incomingJson = JSON.stringify(Array.isArray(card.blocks) ? card.blocks : []);
      useEffect(() => {
        if (incomingJson === latestJsonRef.current) return;
        if (!pendingRef.current) {
          const incoming = Array.isArray(card.blocks) ? card.blocks : [];
          blocksRef.current = incoming;
          latestJsonRef.current = incomingJson;
          savedJsonRef.current = incomingJson;
          setBlocks(incoming);
        }
      }, [card.id, incomingJson]);

      useEffect(() => {
        mountedRef.current = true;
        return () => {
          mountedRef.current = false;
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
          if (pendingRef.current) void flushSave().catch(() => {});
        };
      }, [card.id]);

      const handleDeleteCard = async () => {
        if (!window.confirm('このカードを削除しますか？')) return;
        try {
          if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
          pendingRef.current = false;
          deletedRef.current = true;
          if (inFlightRef.current) await inFlightRef.current.catch(() => {});
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'cards', card.id));
          reportCardSave(card.id, 'synced');
        }
        catch (err) { console.error(err); alert(`カードを削除できませんでした: ${err.message}`); }
      };

      const addBlock = (type) => {
        const newBlock = type === 'text'
          ? { id: createId(), type: 'text', content: '' }
          : { id: createId(), type: 'combo', moveIds: [], state: 'ノーマル', dmg: '', situation: '' };
        commitBlocks(previous => [...previous, newBlock]);
        if (type === 'combo') setEditingBlock(newBlock);
      };

      const removeBlock = (blockId) => commitBlocks(previous => previous.filter(block => block.id !== blockId));
      const moveBlock = (index, direction) => commitBlocks(previous => {
        const next = [...previous];
        const target = index + (direction === 'up' ? -1 : 1);
        if (target < 0 || target >= next.length) return previous;
        [next[index], next[target]] = [next[target], next[index]];
        return next;
      });
      const handleSaveCombo = (updatedComboBlock) => { updateBlock(updatedComboBlock.id, updatedComboBlock, true); setEditingBlock(null); };
      const safeBlocks = Array.isArray(blocks) ? blocks : [];

      return (
        <div className="bg-slate-900 border border-slate-700 rounded-xl shadow-lg overflow-hidden flex flex-col group relative">
          <div className="px-2 py-1 bg-slate-800/50 flex justify-between items-center">
            <span className="text-[10px] text-slate-500">CARD</span>
            <div className="flex items-center gap-1">
              <button onClick={() => onMove(-1)} disabled={isFirst} className="p-1 text-slate-500 hover:text-cyan-400 rounded disabled:opacity-20" title="カードを上へ"><ChevronUp size={14}/></button>
              <button onClick={() => onMove(1)} disabled={isLast} className="p-1 text-slate-500 hover:text-cyan-400 rounded disabled:opacity-20" title="カードを下へ"><ChevronDown size={14}/></button>
              <button onClick={handleDeleteCard} className="p-1 text-red-400 hover:text-red-300 rounded" title="カードを削除"><Trash2 size={14}/></button>
            </div>
          </div>
          <div className="p-3 md:p-4 space-y-4">
            {safeBlocks.map((block, index) => {
              const moveIds = Array.isArray(block.moveIds) ? block.moveIds : [];
              return (
                <div key={block.id} className="relative group/block flex gap-2">
                  <div className="flex-1 min-w-0 relative">
                    {block.type === 'text' ? (
                      <AutoExpandingTextarea value={block.content || ''} onChange={e => updateBlock(block.id, { content: e.target.value })} placeholder="Write your notes here..." className="w-full bg-transparent text-slate-200 border-none focus:ring-0 p-2 hover:bg-slate-800/30 focus:bg-slate-800/50 rounded transition-colors text-sm" />
                    ) : (
                      <div onClick={() => setEditingBlock(block)} className="p-3 bg-slate-950 rounded-lg border border-slate-800 cursor-pointer hover:border-cyan-700 hover:shadow-[0_0_10px_rgba(6,182,212,0.15)] transition-all">
                        <div className="flex flex-wrap items-center gap-1.5 mb-2">
                          {block.state && <span className={`shrink-0 rounded px-2 py-1 text-xs font-bold ${block.state === 'パニカン' ? 'bg-red-600 text-white' : block.state === 'カウンター' ? 'bg-yellow-400 text-yellow-950' : 'bg-slate-700 text-slate-100'}`}>{block.state === '通常' ? 'ノーマル' : block.state}</span>}
                          {moveIds.length > 0 ? moveIds.map((moveId, idx) => {
                            const move = moves.find(item => item.id === moveId) || moves.find(item => item.overrideId === moveId);
                            if (!move) return <span key={`${moveId}-${idx}`} className="text-red-500 text-xs">Unknown Move</span>;
                            return <React.Fragment key={`${moveId}-${idx}`}><MoveTile minimal move={move} />{idx < moveIds.length - 1 && <ChevronRight size={14} className="text-slate-500" />}</React.Fragment>;
                          }) : <span className="text-slate-500 text-sm italic">Empty Combo</span>}
                        </div>
                        {block.dmg && <div className="text-xs text-white font-semibold mt-1">dmg: {block.dmg}</div>}
                        {block.situation && <div className="text-xs text-white mt-1 truncate"><span className="opacity-80">コンボ後の状況:</span> {block.situation}</div>}
                      </div>
                    )}
                  </div>
                  <div className="flex flex-col space-y-1 opacity-0 group-hover/block:opacity-100 transition-opacity justify-center shrink-0">
                    <button onClick={() => moveBlock(index, 'up')} disabled={index === 0} className="p-1 text-slate-500 hover:text-cyan-400 hover:bg-slate-800 rounded disabled:opacity-20"><ChevronUp size={16} /></button>
                    <button onClick={() => moveBlock(index, 'down')} disabled={index === safeBlocks.length - 1} className="p-1 text-slate-500 hover:text-cyan-400 hover:bg-slate-800 rounded disabled:opacity-20"><ChevronDown size={16} /></button>
                    <button onClick={() => removeBlock(block.id)} className="p-1 text-slate-500 hover:text-red-400 hover:bg-slate-800 rounded"><X size={16} /></button>
                  </div>
                </div>
              );
            })}
          </div>
          <div className="bg-slate-950/30 p-2 border-t border-slate-800 flex justify-center space-x-2">
            <button onClick={() => addBlock('text')} className="px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors flex items-center"><Edit2 size={12} className="mr-1.5" /> Add Text</button>
            <button onClick={() => addBlock('combo')} className="px-3 py-1.5 text-xs font-medium text-cyan-400 hover:text-cyan-200 bg-cyan-950 hover:bg-cyan-900 rounded-md border border-cyan-800/50 transition-colors flex items-center"><Sword size={12} className="mr-1.5" /> Add Combo</button>
          </div>
          {editingBlock && editingBlock.type === 'combo' && <ComboBuilderModal isOpen={true} onClose={() => setEditingBlock(null)} initialData={editingBlock} onSave={handleSaveCombo} moves={moves} />}
        </div>
      );
    }

    function ComboBuilderModal({ isOpen, onClose, initialData, onSave, moves }) {
      const [activeCategory, setActiveCategory] = useState(CATEGORIES[0]);
      const normalizeCombo = (data) => ({
        ...data,
        moveIds: Array.isArray(data.moveIds) ? data.moveIds : [],
        state: data.state === '通常' ? 'ノーマル' : (data.state || 'ノーマル'),
        dmg: data.dmg ?? '',
        situation: data.situation ?? ''
      });
      const [comboData, setComboData] = useState(() => normalizeCombo(initialData));
      useEffect(() => { setComboData(normalizeCombo(initialData)); }, [initialData.id]);
      if (!isOpen) return null;

      const currentCategoryMoves = moves.filter(m => m.category === activeCategory);
      const handleAddMove = (moveId) => setComboData(prev => ({ ...prev, moveIds: [...(Array.isArray(prev.moveIds) ? prev.moveIds : []), moveId] }));
      const handleRemoveMove = (index) => setComboData(prev => { const newIds = [...(Array.isArray(prev.moveIds) ? prev.moveIds : [])]; newIds.splice(index, 1); return { ...prev, moveIds: newIds }; });
      const handleChange = (e) => setComboData(prev => ({ ...prev, [e.target.name]: e.target.value }));

      return (
        <Modal isOpen={isOpen} onClose={onClose} title="Combo Builder" maxWidth="max-w-3xl">
          <div className="flex flex-col h-[65vh] min-h-[400px]">
            <div className="bg-slate-950 border border-slate-800 rounded-lg p-3 mb-4 shrink-0 shadow-inner">
              <div className="text-xs text-slate-500 mb-2 uppercase tracking-wide font-semibold">Sequence Preview</div>
              <div className="flex flex-wrap items-center gap-2 min-h-[40px]">
                {comboData.moveIds.length === 0 && <span className="text-slate-600 text-sm italic">Select moves below to build combo...</span>}
                {comboData.moveIds.map((mid, idx) => {
                  const move = moves.find(m => m.id === mid) || moves.find(m => m.overrideId === mid);
                  if (!move) return <div key={idx} onClick={() => handleRemoveMove(idx)} className="cursor-pointer group flex items-center"><span className="bg-red-900/50 text-red-200 px-2 py-1 rounded text-xs">Missing</span>{idx < comboData.moveIds.length - 1 && <ChevronRight size={14} className="text-slate-600 mx-1 group-hover:hidden" />}</div>;
                  return (
                    <React.Fragment key={idx}>
                      <div className="relative group cursor-pointer" onClick={() => handleRemoveMove(idx)} title="Click to remove">
                        <MoveTile minimal move={move} />
                        <div className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity shadow-md"><X size={10} /></div>
                      </div>
                      {idx < comboData.moveIds.length - 1 && <ChevronRight size={16} className="text-slate-500" />}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
            <div className="flex-1 flex flex-col min-h-0 border border-slate-800 rounded-lg overflow-hidden mb-4">
              <div className="flex overflow-x-auto bg-slate-950 border-b border-slate-800 shrink-0">
                {CATEGORIES.map(cat => (
                  <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-3 py-2 text-xs font-medium whitespace-nowrap transition-colors ${activeCategory === cat ? 'bg-cyan-900/30 text-cyan-400 border-b-2 border-cyan-500' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`}>{cat}</button>
                ))}
              </div>
              <div className="flex-1 overflow-y-auto p-3 bg-slate-900/50">
                <div className="flex flex-wrap gap-2">
                  {currentCategoryMoves.map(move => <button key={move.id} onClick={() => handleAddMove(move.overrideId || move.id)} className={`px-3 py-1.5 rounded-md text-sm font-bold border shadow-sm transition-all hover:scale-105 active:scale-95 ${STRENGTH_COLORS[move.strength] || STRENGTH_COLORS['その他']}`}>{move.name}</button>)}
                  {currentCategoryMoves.length === 0 && <div className="w-full text-center text-slate-500 text-sm py-4">No moves found in this category.</div>}
                </div>
              </div>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 shrink-0 pt-2 border-t border-slate-800">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">ヒット</label>
                <select name="state" value={comboData.state === '通常' ? 'ノーマル' : (comboData.state || 'ノーマル')} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500 appearance-none">{COMBO_STATES.map(s => <option key={s} value={s}>{s}</option>)}</select>
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Damage (dmg)</label>
                <input type="text" name="dmg" value={comboData.dmg || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="e.g. 3500" />
              </div>
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">コンボ後の状況</label>
                <input type="text" name="situation" value={comboData.situation || ''} onChange={handleChange} className="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-white text-sm focus:outline-none focus:border-cyan-500" placeholder="e.g. 画面端" />
              </div>
            </div>
            <div className="pt-3 mt-2 flex justify-end space-x-2 shrink-0">
              <button onClick={onClose} className="px-4 py-2 rounded-md text-sm text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">Cancel</button>
              <button onClick={() => onSave({ ...comboData, state: comboData.state === '通常' ? 'ノーマル' : comboData.state })} className="flex items-center px-4 py-2 rounded-md text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors shadow-lg shadow-cyan-900/20"><Save size={16} className="mr-2" /> Save Combo</button>
            </div>
          </div>
        </Modal>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
